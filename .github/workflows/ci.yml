# CI du front Sijil. Chaque étape est bloquante.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (historique et arbre de travail)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --config .gitleaks.toml .
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact --config .gitleaks.toml .

  web:
    name: Front (contrat, lint, types, tests, axe, build, Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      # @awb/ui n'est pas versionné (B-032) : tant que le paquet n'est pas fourni à la CI (registre
      # interne ou artefact privé), cette étape échoue. Le contrôle du contrat est sauté ici, faute
      # de dépôt sijil-kit voisin : il ne tourne qu'en local.
      - name: make install
        run: make install
      - name: Navigateur des scénarios Playwright
        run: npx playwright install --with-deps chromium
        working-directory: sijil-web
      - name: npm run ci
        run: npm run ci

  vulnerabilities:
    name: Dépendances vulnérables (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy (HIGH et CRITICAL bloquants)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
